name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/ui/package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend/ui
        run: npm ci

      # Type-aware ESLint rules read this file, and it is not in Git.
      - name: Generate frontend build info
        working-directory: frontend/ui
        run: node scripts/generate-build-info.js

      - name: Lint
        run: npm run lint
