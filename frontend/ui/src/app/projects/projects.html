<ng-container *transloco="let t; prefix: 'projects'">
  <app-page-header
    [eyebrow]="t('eyebrow', { count: projectCount })"
    [title]="t('title')"
    [lead]="t('lead')"
  />

  <div class="page-container flex flex-col gap-16 pb-24 lg:pb-32">
    <section class="flex flex-col gap-8" aria-labelledby="featured-label">
      <h2 id="featured-label" class="section-label">
        {{ t('featuredLabel') }}
      </h2>

      <app-featured-project />
    </section>

    <section class="flex flex-col gap-8" aria-labelledby="more-label">
      <h2 id="more-label" class="section-label">{{ t('moreLabel') }}</h2>

      <ul class="rule-list">
        @for (project of otherProjects; track project.id) {
        <li>
          <app-project-row [project]="project" />
        </li>
        }
      </ul>
    </section>
  </div>
</ng-container>
