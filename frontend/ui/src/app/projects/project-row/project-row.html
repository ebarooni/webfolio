<ng-container *transloco="let t; prefix: 'projects'">
  @if (project().internalPath; as internalPath) {
    <a [class]="rowClass" [routerLink]="internalPath | localizePath">
      <ng-container
        [ngTemplateOutlet]="content"
        [ngTemplateOutletContext]="{ external: false }"
      />
    </a>
  } @else {
    <a
      [class]="rowClass"
      [href]="project().href"
      target="_blank"
      rel="noopener noreferrer"
    >
      <ng-container
        [ngTemplateOutlet]="content"
        [ngTemplateOutletContext]="{ external: true }"
      />
    </a>
  }

  <ng-template #content let-external="external">
    <h3
      class="flex items-center gap-2 text-[1.375rem] font-semibold tracking-tight text-ink group-hover:text-primary"
    >
      {{ project().title }}
      <app-arrow-icon
        [direction]="external ? 'external' : 'forward'"
        class="text-[0.875rem] text-muted opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
      />
      @if (external) {
        <span class="sr-only">({{ t('externalHint') }})</span>
      }
    </h3>
    <p class="max-w-[60ch]">
      {{ t('items.' + project().id + '.description') }}
    </p>
    <p class="meta-label lg:text-right">{{ tags() }}</p>
  </ng-template>
</ng-container>
