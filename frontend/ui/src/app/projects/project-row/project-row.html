<a
  *transloco="let t; prefix: 'projects'"
  class="group focus-ring flex flex-col gap-x-10 gap-y-2 py-7 transition-[padding] hover:pl-3 motion-reduce:transition-none lg:grid lg:grid-cols-[19rem_minmax(0,1fr)_17.5rem] lg:items-baseline"
  [href]="project().href"
  target="_blank"
  rel="noopener noreferrer"
>
  <h3
    class="flex items-center gap-2 text-[1.375rem] font-semibold tracking-tight text-ink group-hover:text-primary"
  >
    {{ project().title }}
    <app-arrow-icon
      direction="external"
      class="text-[0.875rem] text-muted opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
    />
    <span class="sr-only">({{ t('externalHint') }})</span>
  </h3>
  <p class="max-w-[60ch]">{{ t('items.' + project().id + '.description') }}</p>
  <p class="meta-label lg:text-right">{{ tags() }}</p>
</a>
