<div
  *transloco="let t; prefix: 'contact'"
  class="page-container grid gap-x-18 gap-y-14 pt-40 pb-24 lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)] lg:items-start lg:pt-44 lg:pb-32"
>
  <div class="flex flex-col items-start gap-7">
    <p class="meta-label">{{ t('eyebrow') }}</p>

    <h1
      class="max-w-[14ch] text-page-title leading-[1.04] font-semibold tracking-[-0.035em] text-balance text-ink hyphens-auto"
    >
      {{ t('title') }}
    </h1>

    <p class="max-w-[44ch] text-lead leading-[1.55] text-pretty">
      {{ t('lead') }}
    </p>

    <section
      class="mt-5 hidden w-full max-w-sm lg:block"
      aria-labelledby="elsewhere-label"
    >
      <ng-container [ngTemplateOutlet]="elsewhere" />
    </section>
  </div>

  <app-contact-form
    [isSubmitting]="isSubmitting()"
    [status]="status()"
    (formSubmitted)="submitForm($event)"
  />

  <!-- Small screens show the form before the profile links. -->
  <section class="lg:hidden" aria-labelledby="elsewhere-label-compact">
    <h2 id="elsewhere-label-compact" class="meta-label mb-3 font-medium">
      {{ t('elsewhere') }}
    </h2>
    <ng-container [ngTemplateOutlet]="profileLinks" />
  </section>

  <ng-template #elsewhere>
    <h2 id="elsewhere-label" class="meta-label mb-3 font-medium">
      {{ t('elsewhere') }}
    </h2>
    <ng-container [ngTemplateOutlet]="profileLinks" />
  </ng-template>

  <ng-template #profileLinks>
    <ul>
      @for (link of links; track link.id) {
      <li class="border-t border-base-300 last:border-b">
        <a
          class="group focus-ring flex min-h-13 items-center justify-between gap-4 font-medium text-ink hover:text-primary"
          [href]="link.href"
          target="_blank"
          rel="noopener noreferrer"
        >
          {{ link.label }}
          <span class="meta-label flex items-center gap-2">
            {{ link.handle }}
            <app-arrow-icon class="-rotate-45 text-[0.875rem]" />
          </span>
        </a>
      </li>
      }
    </ul>
  </ng-template>
</div>
