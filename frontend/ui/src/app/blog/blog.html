<ng-container *transloco="let t; prefix: 'blog'">
  <app-page-header
    [eyebrow]="t('eyebrow', { count: posts.length })"
    [title]="t('title')"
    [lead]="t('lead')"
  />

  <section class="page-container pb-24 lg:pb-32" [attr.aria-label]="t('title')">
    <ul class="rule-list">
      @for (post of posts; track post.id) {
      <li>
        <app-post-row [post]="post" [headingLevel]="2" showSummary />
      </li>
      }
    </ul>
  </section>
</ng-container>
