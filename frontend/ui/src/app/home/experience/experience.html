<section
  *transloco="let t; prefix: 'home.experience'"
  id="experience"
  class="page-container flex flex-col gap-8 pb-24 lg:pb-32"
>
  <h2 class="meta-label font-medium">{{ t('label') }}</h2>

  <ol>
    @for (stepKey of stepKeys; track stepKey) {
    <li
      class="flex flex-wrap items-baseline gap-x-8 gap-y-1.5 border-t border-base-300 py-6 last:border-b"
    >
      <p class="meta-label basis-35">{{ t(stepKey + '.period') }}</p>
      <h3 class="flex-[1_1_16rem] text-[1.0625rem] font-semibold text-ink">
        {{ t(stepKey + '.title') }}
      </h3>
      <p class="flex-[2_1_20rem]">{{ t(stepKey + '.body') }}</p>
    </li>
    }
  </ol>
</section>
