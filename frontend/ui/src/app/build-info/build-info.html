<ng-container *transloco="let t; prefix: 'buildInfo'">
  <app-page-header
    [eyebrow]="t('eyebrow')"
    [title]="t('title')"
    [lead]="t('lead')"
  />

  <div class="page-container flex flex-col gap-20 pb-24 lg:pb-32">
    <app-build-facts />

    <div class="grid items-start gap-x-18 gap-y-16 lg:grid-cols-2">
      <app-dependencies [title]="t('runtime')" [dependencies]="dependencies" />
      <app-dependencies
        [title]="t('buildTime')"
        [dependencies]="devDependencies"
      />
    </div>
  </div>
</ng-container>
