<table
  *transloco="let t; prefix: 'buildInfo'"
  class="w-full border-collapse text-[0.9375rem]"
>
  <caption class="meta-label pb-4 text-left font-medium">
    {{ title() }} · {{ dependencies().length }}
  </caption>

  <thead class="sr-only">
    <tr>
      <th scope="col">{{ t('package') }}</th>
      <th scope="col">{{ t('packageVersion') }}</th>
    </tr>
  </thead>

  <tbody>
    @for (dependency of dependencies(); track dependency.name) {
    <tr class="border-t border-base-300 last:border-b">
      <th
        scope="row"
        class="py-3 pr-4 text-left font-medium wrap-anywhere text-ink"
      >
        {{ dependency.name }}
      </th>
      <td class="meta-label py-3 text-right whitespace-nowrap">
        {{ dependency.version }}
      </td>
    </tr>
    }
  </tbody>
</table>
