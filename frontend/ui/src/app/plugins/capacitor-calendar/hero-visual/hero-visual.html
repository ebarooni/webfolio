<app-code-block
  class="code"
  [code]="snippet"
  language="typescript"
  label="calendar.ts"
  compact
/>

<figure class="event" aria-label="The event that the code creates">
  <figcaption class="event-app">
    <span class="app-icon" aria-hidden="true">
      <span class="app-icon-day">Mon</span>
      <span class="app-icon-date">17</span>
    </span>
    Calendar
    <span class="saved">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M4.5 10.5l3.5 3.5 7.5-8" />
      </svg>
      Saved
    </span>
  </figcaption>
  <div class="event-body">
    <span class="event-bar" aria-hidden="true"></span>
    <div>
      <p class="event-title">Product review</p>
      <p class="event-meta">Office</p>
      <p class="event-meta">In 1 hour · 60 min</p>
    </div>
  </div>
</figure>

<ul class="platforms" aria-label="Platforms">
  <li><span class="dot ios" aria-hidden="true"></span>iOS</li>
  <li><span class="dot android" aria-hidden="true"></span>Android</li>
  <li><span class="dot web" aria-hidden="true"></span>Web · .ics</li>
</ul>
