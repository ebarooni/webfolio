<section
  id="resources"
  class="page-container py-20 lg:py-28"
  aria-labelledby="resources-title"
>
  <app-section-heading
    [label]="copy().label"
    [title]="copy().title"
    [lead]="copy().lead"
    headingId="resources-title"
  />

  <ul class="grid">
    @for (resource of resources; track resource.id) {
      <li class="scroll-reveal">
        <a class="card" [href]="resource.href" rel="noopener">
          <span class="source">{{ copy().sources[resource.source] }}</span>
          <span class="title">
            {{ copy().resources[resource.id].title }}
            <app-arrow-icon direction="external" class="arrow" />
          </span>
          <span class="body">{{ copy().resources[resource.id].body }}</span>
        </a>
      </li>
    }
  </ul>
</section>
