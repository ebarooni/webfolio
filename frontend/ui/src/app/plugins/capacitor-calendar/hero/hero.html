<section class="hero" aria-labelledby="hero-title">
  <div class="page-container hero-grid">
    <div class="flex min-w-0 flex-col items-start gap-7">
      <nav [attr.aria-label]="copy().breadcrumbLabel">
        <ol class="meta-label flex flex-wrap items-center gap-2">
          <li>
            <a
              class="focus-ring rounded hover:text-ink"
              [routerLink]="projectsLink | localizePath"
              >{{ copy().work }}</a
            >
          </li>
          <li aria-hidden="true">/</li>
          <li><span aria-current="page">Capacitor Calendar</span></li>
        </ol>
      </nav>

      <p class="eyebrow">
        <span class="pulse" aria-hidden="true"></span>
        {{ copy().eyebrow }}
      </p>

      <h1 id="hero-title" class="title">
        {{ copy().titleLead }}
        <span class="gradient-text">{{ copy().titleAccent }}</span>
      </h1>

      <p class="max-w-[54ch] text-lead leading-[1.55] text-pretty">
        {{ copy().lead }}
      </p>

      <app-install-command
        class="w-full max-w-[30rem]"
        [command]="installCommand"
      />

      <div class="flex flex-wrap items-center gap-3">
        <a
          appButton
          [routerLink]="pageLink | localizePath"
          fragment="quick-start"
        >
          {{ copy().getStarted }}
          <app-arrow-icon direction="down" />
        </a>
        <a class="ghost-button focus-ring" [href]="links.docs" rel="noopener">
          {{ copy().docs }}
          <app-arrow-icon direction="external" />
        </a>
        <a
          class="icon-button focus-ring"
          [href]="links.github"
          rel="noopener"
          [attr.aria-label]="copy().githubLabel"
        >
          <app-brand-icon brand="github" />
        </a>
        <a
          class="icon-button focus-ring"
          [href]="links.npm"
          rel="noopener"
          [attr.aria-label]="copy().npmLabel"
        >
          <app-brand-icon brand="npm" />
        </a>
      </div>
    </div>

    <app-hero-visual />
  </div>

  <div class="page-container">
    <ul class="badges" [attr.aria-label]="copy().badgesLabel">
      @for (badge of badges; track badge.id) {
        <li>
          <a
            class="focus-ring block rounded"
            [href]="badge.href"
            rel="noopener"
          >
            <!-- NgOptimizedImage needs a width. A live badge has no fixed width. -->
            <!-- eslint-disable @angular-eslint/template/prefer-ngsrc -->
            <img
              [src]="badge.image"
              [alt]="copy().badges[badge.id]"
              height="20"
              loading="lazy"
              decoding="async"
            />
            <!-- eslint-enable @angular-eslint/template/prefer-ngsrc -->
          </a>
        </li>
      }
    </ul>
  </div>
</section>
