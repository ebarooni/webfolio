<section class="page-container py-20 lg:py-28" aria-labelledby="features-title">
  <app-section-heading
    label="Features"
    title="The whole calendar, not just “add to calendar”."
    lead="Most apps start with one event. Then they need to read the calendar, edit what they wrote, and ask for the right permission. The plugin covers that whole path."
    headingId="features-title"
  />

  <ul class="bento">
    @for (feature of features; track feature.id) {
      <li
        class="card scroll-reveal"
        [class.wide]="feature.span === 'wide'"
        [class.full]="feature.span === 'full'"
      >
        <h3 class="card-title">{{ feature.title }}</h3>
        <p class="card-body">{{ feature.body }}</p>
        <ul class="chips" [attr.aria-label]="feature.title + ': related API'">
          @for (chip of feature.chips; track chip) {
            <li>
              <code>{{ chip }}</code>
            </li>
          }
        </ul>
      </li>
    }
  </ul>
</section>
