<section
  id="faq"
  class="page-container py-20 lg:py-28"
  aria-labelledby="faq-title"
>
  <div class="layout">
    <app-section-heading
      label="FAQ"
      title="Questions developers ask first."
      lead="Short answers, and where to find the details. The plugin documentation is always the current source."
      headingId="faq-title"
    />

    <div class="questions">
      @for (entry of entries; track entry.id; let first = $first) {
        <details name="capacitor-calendar-faq" [open]="first">
          <summary>
            <h3>{{ entry.question }}</h3>
            <span class="marker" aria-hidden="true"></span>
          </summary>
          <p class="answer">
            @for (part of entry.parts; track $index) {
              @if (part.code) {
                <code>{{ part.text }}</code>
              } @else {
                {{ part.text }}
              }
            }
          </p>
        </details>
      }
    </div>
  </div>
</section>
