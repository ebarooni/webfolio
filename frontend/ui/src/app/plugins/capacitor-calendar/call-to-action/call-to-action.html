<section class="page-container pb-24 lg:pb-32" aria-labelledby="cta-title">
  <div class="panel">
    <h2 id="cta-title" class="title">
      {{ copy().titleLead }}
      <span class="gradient-text">{{ copy().titleAccent }}</span>
    </h2>
    <p class="lead">
      {{ copy().lead }}
    </p>

    <app-install-command
      class="w-full max-w-[30rem]"
      [command]="installCommand"
    />

    <ul class="links">
      <li>
        <a class="link-card focus-ring" [href]="links.docs" rel="noopener">
          <span class="link-title"
            >{{ copy().docsTitle }} <app-arrow-icon direction="external"
          /></span>
          <span class="link-text">{{ copy().docsText }}</span>
        </a>
      </li>
      <li>
        <a class="link-card focus-ring" [href]="links.github" rel="noopener">
          <span class="link-title"
            ><app-brand-icon brand="github" /> GitHub</span
          >
          <span class="link-text">{{ copy().githubText }}</span>
        </a>
      </li>
      <li>
        <a class="link-card focus-ring" [href]="links.npm" rel="noopener">
          <span class="link-title"><app-brand-icon brand="npm" /> npm</span>
          <span class="link-text">{{ copy().npmText }}</span>
        </a>
      </li>
    </ul>

    <p class="author">
      {{ copy().author }}
      <a
        class="author-link focus-ring"
        [routerLink]="contactLink | localizePath"
        >{{ copy().contact }}</a>.
    </p>
  </div>
</section>
