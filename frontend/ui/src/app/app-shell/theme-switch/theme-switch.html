<button
  *transloco="let t; prefix: 'shell.theme'"
  type="button"
  class="theme-switch focus-ring"
  [class.is-dark]="isDark()"
  [class.is-chasing]="isChasing()"
  [attr.aria-label]="t('switchLabel')"
  [attr.aria-pressed]="isDark()"
  (click)="toggle()"
>
  <svg aria-hidden="true" width="76" height="44" viewBox="0 0 76 44">
    <defs>
      <linearGradient id="theme-switch-day" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6fbdfa" />
        <stop offset="1" stop-color="#d4ecff" />
      </linearGradient>
      <linearGradient id="theme-switch-night" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0b1030" />
        <stop offset="1" stop-color="#2b3568" />
      </linearGradient>
    </defs>

    <rect width="76" height="44" fill="url(#theme-switch-day)" />
    <rect
      class="night"
      width="76"
      height="44"
      fill="url(#theme-switch-night)"
    />

    <g class="night stars" fill="#fff">
      <circle cx="10" cy="11" r="1" />
      <circle cx="19" cy="20" r="0.8" />
      <circle cx="33" cy="9" r="0.9" />
      <circle cx="38" cy="19" r="0.6" />
      <circle cx="14" cy="27" r="0.6" />
      <path
        d="M25 8.5 25.9 12.1 29.5 13 25.9 13.9 25 17.5 24.1 13.9 20.5 13 24.1 12.1Z"
      />
    </g>

    <g class="day clouds" fill="#fff">
      <circle cx="49" cy="15" r="4" />
      <circle cx="54.5" cy="12.5" r="5" />
      <circle cx="60" cy="15.5" r="3.5" />
      <rect x="45.5" y="15" width="18" height="4" rx="2" />
      <rect x="57" y="24" width="11" height="3" rx="1.5" opacity="0.75" />
    </g>

    <g class="knob">
      <g [attr.transform]="celestialTransform()">
        <g class="day sun">
          <circle cx="22" cy="20" r="16" fill="#ffd86b" opacity="0.35" />
          <circle cx="22" cy="20" r="11" fill="#ffc533" />
        </g>
        <g class="night moon">
          <circle cx="22" cy="20" r="11" fill="#eef1fa" />
          <circle cx="18" cy="16.5" r="2.4" fill="#cbd2e6" />
          <circle cx="26" cy="21" r="1.6" fill="#cbd2e6" />
          <circle cx="20.5" cy="25" r="1.2" fill="#cbd2e6" />
        </g>
      </g>
    </g>

    <g class="day">
      @if (season === 'winter') {
      <g class="snowflakes" fill="#fff">
        <circle cx="42" cy="8" r="0.8" />
        <circle cx="50" cy="27" r="0.7" />
        <circle cx="66" cy="9" r="0.7" />
        <circle cx="70" cy="24" r="0.8" />
        <circle cx="40" cy="22" r="0.6" />
      </g>
      }
      <path d="M0 44V35Q16 27 34 34T76 31V44Z" [attr.fill]="hillColors.back" />
      <path d="M0 44V40Q22 33 44 39T76 37V44Z" [attr.fill]="hillColors.front" />
      @if (season === 'spring') {
      <g class="blossoms" fill="#ff9ec4">
        <circle cx="7" cy="36.5" r="1" />
        <circle cx="18" cy="33.5" r="0.9" />
        <circle cx="30" cy="38.5" r="1" />
        <circle cx="47" cy="35.5" r="0.9" />
        <circle cx="58" cy="39.5" r="1" />
        <circle cx="68" cy="34" r="0.9" />
      </g>
      }
    </g>

    <g class="night">
      <path
        d="M0 44V36L12 25 22 33 35 21 50 35 60 28 76 38V44Z"
        fill="#3a4680"
      />
      <path d="M35 21 39.5 25.2 36.5 27 34.5 25 31.5 26.2Z" fill="#dce2f5" />
      <path d="M0 44V40L10 35 24 41 42 33 58 41 76 36V44Z" fill="#1a2148" />
    </g>
  </svg>
</button>
