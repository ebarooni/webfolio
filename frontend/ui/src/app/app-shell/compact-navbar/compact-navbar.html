<div
  class="collapse rounded-none bg-transparent"
  [class.collapse-open]="isMenuOpen()"
>
  <input
    type="checkbox"
    class="hidden"
    tabindex="-1"
    aria-hidden="true"
    [checked]="isMenuOpen()"
    readonly
  />

  <div class="collapse-title px-3 pt-3">
    <nav
      class="navbar min-h-0 rounded-xl border border-base-content/8 bg-base-100/80 px-2 py-1 text-base-content/80 shadow-lg shadow-black/5 backdrop-blur-xl backdrop-saturate-150"
      aria-label="Primary"
    >
      <div class="navbar-start">
        <button
          type="button"
          class="btn btn-ghost btn-sm border-transparent! shadow-none! hover:bg-base-content/5"
          (click)="openThemeSelector()"
        >
          Theme
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
            class="size-4"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m19.5 8.25-7.5 7.5-7.5-7.5"
            />
          </svg>
        </button>
      </div>

      <div class="navbar-end">
        <button
          type="button"
          class="btn btn-ghost btn-circle btn-sm h-9 min-w-9 w-9 shrink-0 border-transparent! p-0 shadow-none!"
          aria-label="Toggle menu"
          aria-controls="compact-nav-menu"
          [attr.aria-expanded]="isMenuOpen()"
          (click)="toggleMenu()"
        >
          @if (!isMenuOpen()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            class="size-5 fill-current"
            aria-hidden="true"
          >
            <path
              d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z"
            />
          </svg>
          } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            class="size-5 fill-current"
            aria-hidden="true"
          >
            <polygon
              points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49"
            />
          </svg>
          }
        </button>
      </div>
    </nav>
  </div>

  <div class="collapse-content px-3 pb-3">
    <ul
      id="compact-nav-menu"
      class="menu mt-2 w-full gap-1 rounded-xl border border-base-content/8 bg-base-100/80 p-2 text-base-content/80 shadow-lg shadow-black/5 backdrop-blur-xl backdrop-saturate-150"
      role="list"
    >
      @for (item of navItems; track item.route) { @if (!item.requiresVersion ||
      version()) {
      <li>
        <a
          class="rounded-lg font-semibold"
          [routerLink]="item.route"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          [routerLinkActive]="[
            'bg-base-content/6!',
            'text-base-content!',
            '[[data-theme=dark]_&]:bg-base-content/10!',
          ]"
          (click)="closeMenu()"
        >
          @if (item.requiresVersion) { {{ version() }} } @else { {{ item.label
          }} }
        </a>
      </li>
      } }
    </ul>
  </div>
</div>

<app-theme-selector-modal
  #themeSelectorModal
  [selectedTheme]="selectedTheme()"
  (themeChanged)="onThemeChanged($event)"
></app-theme-selector-modal>
