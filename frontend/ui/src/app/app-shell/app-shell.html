<!--
  The navbar and the footer show the stored language, theme and developer
  mode. A prerendered page has only the defaults, so the browser renders
  these two again instead of reusing the server markup.
-->
<header class="site-header-transition fixed top-0 z-10 w-full">
  <app-navbar
    ngSkipHydration
    [selectedTheme]="theme()"
    [selectedLanguage]="language()"
    (themeChanged)="themeChanged($event)"
    (languageChanged)="languageChanged($event)"
  />
</header>

<main class="flex flex-1 flex-col">
  <router-outlet />
</main>

<app-footer
  ngSkipHydration
  [bgClass]="uiConfig().footerBgClass"
  [version]="version"
  [developerMode]="developerMode()"
  (developerModeEnabled)="developerModeEnabled()"
/>
