<div
  *transloco="let t; prefix: 'shell.nav'"
  class="bg-base-100/80 backdrop-blur-xl backdrop-saturate-150"
>
  <div
    class="page-container flex flex-wrap items-center justify-between gap-x-4 gap-y-3 py-3"
  >
    <app-brand />

    <!-- Small screens show the links as a second row below the brand. -->
    <nav
      class="order-last flex w-full gap-0.5 rounded-[0.875rem] border border-base-300 bg-base-100 p-1 lg:order-none lg:w-auto"
      [attr.aria-label]="t('label')"
    >
      @for (item of navItems; track item.labelKey) {
      <a
        class="focus-ring flex min-h-10 flex-1 items-center justify-center rounded-[0.625rem] px-1 text-sm font-medium whitespace-nowrap hover:bg-base-300 hover:text-ink lg:min-h-9 lg:flex-none lg:px-4"
        [routerLink]="item.link"
        [fragment]="item.fragment"
        [routerLinkActive]="item.fragment ? '' : ['bg-base-200', 'text-ink']"
      >
        {{ t(item.labelKey) }}
      </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <app-language-switch
        [language]="selectedLanguage()"
        (languageChanged)="languageChanged.emit($event)"
      />
      <app-theme-switch
        [theme]="selectedTheme()"
        (themeChanged)="themeChanged.emit($event)"
      />
    </div>
  </div>
</div>
