<ng-container *transloco="let t; prefix: 'accessDenied'">
  <header class="page-container flex min-h-17 items-center gap-3 py-3">
    <app-monogram />
    <span class="font-semibold tracking-tight text-ink">Ehsan Barooni</span>
  </header>

  <main class="page-container grid flex-1 place-items-center py-12">
    <app-page-intro
      class="w-full max-w-120"
      size="compact"
      titleId="access-denied-title"
      [eyebrow]="t('eyebrow')"
      [title]="t('title')"
      [lead]="t('lead')"
    >
      <form
        class="flex w-full flex-wrap items-end gap-3 rounded-3xl bg-base-200 p-6"
        novalidate
        aria-labelledby="access-denied-title"
        (ngSubmit)="submit()"
      >
        <app-form-field
          class="min-w-0 flex-[1_1_13.75rem]"
          controlId="access-password"
          [label]="t('password')"
        >
          <input
            id="access-password"
            type="password"
            class="field"
            autocomplete="current-password"
            [value]="password()"
            (input)="updatePassword($event)"
          />
        </app-form-field>

        <button
          appButton
          type="submit"
          class="grow sm:grow-0"
          [disabled]="!isPasswordValid()"
        >
          {{ t('submit') }}
        </button>
      </form>
    </app-page-intro>
  </main>
</ng-container>
