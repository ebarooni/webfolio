<section class="bms-section bms-section-follow" aria-labelledby="final-title">
  <div class="bms-wrap">
    <div class="bms-final" appReveal>
      <img
        class="bms-app-icon"
        [src]="assets.appIcon"
        width="88"
        height="88"
        alt=""
        loading="lazy"
      />
      <h2 id="final-title">{{ copy.finalCta.title }}</h2>
      <p class="bms-lead bms-final-lead">{{ copy.finalCta.lead }}</p>
      <div class="bms-cta-row">
        <a
          class="bms-btn-store"
          [attr.href]="copy.storeHref"
          [attr.role]="copy.storeHref === null ? 'button' : null"
          [attr.tabindex]="copy.storeHref === null ? 0 : null"
          [attr.aria-label]="copy.finalCta.label"
          (click)="blockStore($event)"
          (auxclick)="blockStore($event)"
          (keydown)="blockStoreKey($event)"
        >
          {{ copy.finalCta.label }}
          <span aria-hidden="true">→</span>
        </a>
      </div>
      <p class="bms-reqs">
        @for (item of copy.requirements; track item) {
        <span>{{ item }}</span>
        }
      </p>
    </div>
  </div>
</section>
