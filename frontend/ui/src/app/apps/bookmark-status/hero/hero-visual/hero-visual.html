<div class="glow" aria-hidden="true"></div>
<app-bookmark-status-shot
  name="hero-tree"
  [theme]="theme()"
  [alt]="copy.shotAlt"
  [width]="1280"
  [height]="918"
  frameClass="bookmark-status-hero-shot"
  [eager]="true"
  [priority]="true"
/>
<app-bookmark-status-shot
  name="toolbar-tip"
  [theme]="theme()"
  [alt]="copy.toolbarAlt"
  [width]="533"
  [height]="100"
  frameClass="float-toolbar"
  [eager]="true"
/>
<div class="float-pill" aria-hidden="true">
  <span class="float-icon">
    <svg
      width="18"
      height="18"
      viewBox="0 0 20 20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="4" y="8.5" width="12" height="8.5" rx="2" />
      <path d="M7 8.5V6.5a3 3 0 0 1 6 0v2" />
    </svg>
  </span>
  <span>
    <strong>{{ copy.pillTitle }}</strong>
    <span>{{ copy.pillBody }}</span>
  </span>
</div>
<div class="fade" aria-hidden="true"></div>
