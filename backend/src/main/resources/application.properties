%dev.quarkus.http.cors.enabled=true
# The OpenAPI spec is also what the MCP server serves, so it names and describes the API.
quarkus.smallrye-openapi.info-title=WebFolio API
quarkus.smallrye-openapi.info-description=REST API of barooni.dev, the portfolio website of Ehsan Barooni. \
  It receives messages from the contact form.
quarkus.rest-client.open-api-client.url=http://localhost:${quarkus.http.port:8080}
# The MCP server is for local development and AI tooling only. Its HTTP transport is a build-time
# setting, so the production build (prod profile) ships without the /mcp endpoint.
%prod.quarkus.mcp.server.http.enabled=false
