# Based on the "rootless, read-only" example in bitwarden/self-host
# bitwarden-lite/docker-compose.yml. SQLite needs no database service.
services:
  bitwarden:
    # The digest pins the image. The tag is only for people to read.
    image: ghcr.io/bitwarden/lite:2026.10.1@sha256:f2d693cc9ebf73f22c969dae3c36b3747b06edbd1fe2fca7291e5b61e309b960
    container_name: bitwarden
    restart: unless-stopped

    env_file:
      - settings.env

    environment:
      # Written into the backup manifest. Keep it equal to the image tag.
      BACKUP_LITE_TAG: "2026.10.1"

    # Runs as UID/GID 911, the image's default PUID/PGID. The host folders
    # bwdata, logs and backups must be owned by 911:911, or the container
    # cannot write to them. Setup step 5 in docs/setup-bitwarden.md does the chown.
    user: "911:911"

    expose:
      - "8080"

    # Admin panel access over an SSH tunnel only (see "Reach the admin panel
    # safely" in docs/setup-bitwarden.md). 127.0.0.1 is the loopback address:
    # only programs on the server itself can connect to it. Never remove
    # "127.0.0.1:". Without it, Docker publishes port 8081 on every address
    # of the server, the internet included, and ufw does not stop that.
    ports:
      - "127.0.0.1:8081:8080"

    volumes:
      - ./bwdata:/etc/bitwarden
      - ./logs:/var/log/bitwarden
      - ./backups:/backups

    # Own network, shared only with Caddy. Other containers on "proxy" cannot
    # reach Bitwarden. It is a normal bridge network (not "internal"), so
    # Bitwarden can still send mail over SMTP and reach the Bitwarden cloud
    # for license and push services.
    networks:
      - bitwarden

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=768m

    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bitwarden:
    external: true
