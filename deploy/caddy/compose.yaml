services:
  caddy:
    image: caddy:2.11.2-alpine
    container_name: caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    # "proxy" is shared by all services. "bitwarden" is shared with Bitwarden
    # only, so no other container can reach the vault. Both networks must
    # exist before Caddy starts (see docs/setup-server.md).
    networks:
      - proxy
      - bitwarden
    
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
  bitwarden:
    external: true
